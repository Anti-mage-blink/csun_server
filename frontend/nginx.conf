server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 精确匹配验证文件
    location = /WW_verify_O9vBstsCay8y3gf3.txt {
            # 确保以纯文本格式返回，防止浏览器直接下载
            default_type text/plain;
            # 💡 强力阻止任何浏览器或代理缓存此文件
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 单独对入口文件 index.html 禁用强缓存，确保部署新版后浏览器能即时拉取最新入口文件
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
        expires -1;
    }

    # SPA 路由回退（React Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
        # 防止直接访问页面时命中了浏览器的 HTML 强缓存
        add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0";
    }

    # 反向代理到统一 Gin 后端
    # backend 为后端容器名/服务名，需与 docker-compose 中保持一致
    # proxy_pass 末尾不带 /，保留 /api 前缀原样转发（后端路由注册在 /api group 下）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存策略：采用协商缓存 (no-cache)
    # 允许浏览器缓存资源，但每次使用前必须向服务器验证（比对 ETag/Last-Modified）。
    # 若文件已更新，立即下载最新版本；若无更新，返回 304 快速加载。确保任何页面、任何静态资源都能实时显示最新版。
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
