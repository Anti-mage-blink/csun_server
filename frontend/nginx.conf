server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 精确匹配这个验证文件，直接从 /var/www/html 目录下读取
    location = /WW_verify_O9vBstsCay8y3gf3.txt {
            # 确保以纯文本格式返回，防止浏览器直接下载
            default_type text/plain;
            # 💡 强力阻止任何浏览器或代理缓存此文件
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # SPA 路由回退（React Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到统一 Gin 后端
    # backend 为后端容器名/服务名，需与 docker-compose 中保持一致
    # proxy_pass 末尾不带 /，保留 /api 前缀原样转发（后端路由注册在 /api group 下）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
