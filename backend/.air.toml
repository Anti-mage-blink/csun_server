# Air 配置文件，用于 Go 代码热更新 (Hot Reload)
root = "."
tmp_dir = "tmp"

[build]
  # 编译命令
  cmd = "go build -o ./tmp/main.exe main.go"
  # 编译出的二进制文件路径 (Air 最新规范使用 entrypoint，并使用正斜杠)
  entrypoint = "./tmp/main.exe"
  # 额外监视的文件后缀
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
  # 排除忽略的目录
  exclude_dir = ["assets", "tmp", "vendor", "docs", "frontend", "node_modules"]
  # 排除测试文件
  exclude_regex = ["_test\\.go"]
  # 修改文件后的编译延迟 (毫秒)
  delay = 500
  # 终止旧进程后的等待延迟，确保 Windows 释放文件锁与 TCP 端口
  kill_delay = "500ms"
  # 发生编译错误时不停止 air 监听进程，等待修复/下一次文件变更后自动重新编译
  stop_on_error = false
  # 开启文件轮询检测 (针对 Windows 环境，彻底解决 VS Code 保存不触发热更新的问题)
  poll = true
  poll_interval = 500
  # 日志输出路径
  log = "air_errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  app = "green"

[log]
  time = false

[misc]
  clean_on_exit = true
