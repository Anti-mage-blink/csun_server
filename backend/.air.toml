# Air 配置文件，用于 Go 代码热更新 (Hot Reload)
root = "."
tmp_dir = "tmp"

[build]
  # 编译命令
  cmd = "go build -o ./tmp/main.exe main.go"
  # 编译出的二进制文件路径
  bin = ".\\tmp\\main.exe"
  # 额外监视的文件后缀
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
  # 排除忽略的目录
  exclude_dir = ["assets", "tmp", "vendor", "docs"]
  # 排除测试文件
  exclude_regex = ["_test\\.go"]
  # 修改文件后的编译延迟 (毫秒)
  delay = 500
  # 发生编译错误时停止运行旧版本
  stop_on_error = true
  # 日志输出路径
  log = "air_errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  app = "green"

[log]
  time = false

[misc]
  clean_on_exit = true
